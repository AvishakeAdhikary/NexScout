<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <title>Starting NexScout…</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          15px system-ui,
          sans-serif;
        color: #ececf6;
        background: #121224;
        text-align: center;
      }
      img {
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.94);
          opacity: 0.75;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        img {
          animation: none;
        }
      }
      p {
        color: #b3b3cc;
      }
      /* The window is frameless: this strip moves it, and the window controls sit on its right. */
      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 56px;
        -webkit-app-region: drag;
        app-region: drag;
      }
    </style>
  </head>
  <body>
    <div class="titlebar" aria-hidden="true"></div>
    <div>
      <img src="icon.png" width="72" height="72" alt="" />
      <h1>Starting NexScout…</h1>
      <p>Starting the local servers. This can take up to a minute the first time.</p>
    </div>
  </body>
</html>
