# Packaging for the NexScout desktop shell. See docs/OPERATIONS.md ("Desktop") for what was
# actually built and verified on which platform.
appId: org.nexscout.desktop
productName: NexScout
copyright: NexScout contributors
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*.js
  - assets/**/*
  - package.json
asar: true
win:
  target: [nsis]
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.productivity
  icon: assets/icon.png
  hardenedRuntime: true
linux:
  target: [AppImage]
  category: Office
  icon: assets/icon.png
# Easy mode: the compose file and database init script that NexScout's own Docker stack uses
# (the compose file refers to ../docker/postgres/01-roles.sql, so the layout is kept).
extraResources:
  - from: ../../easy/docker-compose.yml
    to: easy/docker-compose.yml
  - from: ../../docker/postgres/01-roles.sql
    to: docker/postgres/01-roles.sql
