# Packaging for the NexScout desktop shell. See docs/OPERATIONS.md ("Desktop") for what was
# actually built and verified on which platform.
appId: org.nexscout.desktop
productName: NexScout
copyright: NexScout contributors
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*.js
  - assets/**/*
  - package.json
asar: true
win:
  target: [nsis]
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub would rename the asset and break the name in latest.yml.
  artifactName: NexScout-Setup-${version}.${ext}
# In-app updates (src/updates.ts) read latest.yml from this repository's GitHub releases. The
# release workflow builds with --publish never and uploads latest.yml, the installer and its
# blockmap itself.
publish:
  provider: github
  owner: AvishakeAdhikary
  repo: NexScout
  releaseType: release
mac:
  target: [dmg]
  category: public.app-category.productivity
  icon: assets/icon.png
  hardenedRuntime: true
linux:
  target: [AppImage]
  category: Office
  icon: assets/icon.png
# Easy mode: the compose file and database init script that NexScout's own Docker stack uses
# (the compose file refers to ../docker/postgres/01-roles.sql, so the layout is kept).
extraResources:
  - from: ../../easy/docker-compose.yml
    to: easy/docker-compose.yml
  - from: ../../docker/postgres/01-roles.sql
    to: docker/postgres/01-roles.sql
