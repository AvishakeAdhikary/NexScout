# NexScout local development stack.
#   docker compose up -d postgres          # just the database (run api/worker/web natively)
#   docker compose --profile full up -d    # everything in containers
name: nexscout

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NEXSCOUT_PG_SUPERUSER_PASSWORD:-postgres_dev_only}
    ports:
      - "127.0.0.1:${NEXSCOUT_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexscout"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["sh", "-c", "nexscout migrate && nexscout serve --host 0.0.0.0 --port 8000"]
    environment:
      NEXSCOUT_DATABASE_URL: postgresql+psycopg://nexscout_app:nexscout_app_dev@postgres:5432/nexscout
      NEXSCOUT_MIGRATION_DATABASE_URL: postgresql+psycopg://nexscout_owner:nexscout_owner_dev@postgres:5432/nexscout
      NEXSCOUT_STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXSCOUT_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storage:
